<!-- Traditional Pattern Definitions -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Koushi (格子) - Japanese Lattice Pattern with Washi Interior -->
    <pattern id="koushi-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- White washi paper background -->
      <rect width="80" height="80" fill="#fffef9"/>
      <!-- Washi texture in each grid cell -->
      <rect x="2" y="2" width="36" height="36" fill="url(#washi-texture)" opacity="0.6"/>
      <rect x="42" y="2" width="36" height="36" fill="url(#washi-texture)" opacity="0.6"/>
      <rect x="2" y="42" width="36" height="36" fill="url(#washi-texture)" opacity="0.6"/>
      <rect x="42" y="42" width="36" height="36" fill="url(#washi-texture)" opacity="0.6"/>
      <!-- Brown/cedar wood grid lines -->
      <line x1="0" y1="0" x2="80" y2="0" stroke="#4a2f1a" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#4a2f1a" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="80" x2="80" y2="80" stroke="#4a2f1a" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#4a2f1a" stroke-width="3" opacity="0.7"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#4a2f1a" stroke-width="3" opacity="0.7"/>
      <line x1="80" y1="0" x2="80" y2="80" stroke="#4a2f1a" stroke-width="3" opacity="0.7"/>
      <!-- Wood grain highlights on grid lines -->
      <line x1="0" y1="1" x2="80" y2="1" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="1" y1="0" x2="1" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    </pattern>

    <!-- Seigaiha (青海波) - Wave Pattern -->
    <pattern id="seigaiha-pattern" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M0,30 Q15,15 30,30 T60,30" fill="none" stroke="#3d2817" stroke-width="1" opacity="0.08"/>
      <path d="M0,30 Q15,20 30,30 T60,30" fill="none" stroke="#3d2817" stroke-width="0.8" opacity="0.06"/>
      <path d="M-30,30 Q-15,15 0,30 T30,30" fill="none" stroke="#3d2817" stroke-width="1" opacity="0.08"/>
      <path d="M-30,30 Q-15,20 0,30 T30,30" fill="none" stroke="#3d2817" stroke-width="0.8" opacity="0.06"/>
    </pattern>

    <!-- Asanoha (麻の葉) - Hemp Leaf Pattern -->
    <pattern id="asanoha-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <g opacity="0.08" stroke="#3d2817" stroke-width="1" fill="none">
        <line x1="40" y1="0" x2="40" y2="80"/>
        <line x1="0" y1="40" x2="80" y2="40"/>
        <line x1="0" y1="0" x2="80" y2="80"/>
        <line x1="80" y1="0" x2="0" y2="80"/>
        <circle cx="40" cy="40" r="20"/>
      </g>
    </pattern>

    <!-- Tang Dynasty Cloud Pattern (唐草雲紋) -->
    <pattern id="tang-cloud-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.06" fill="none" stroke="#8b0000" stroke-width="1.5">
        <path d="M20,50 Q30,30 50,40 T80,50"/>
        <path d="M10,70 Q25,55 40,65 T70,75"/>
        <circle cx="50" cy="50" r="15"/>
      </g>
    </pattern>

    <!-- Dougong (斗拱) - Bracket Pattern -->
    <pattern id="dougong-pattern" x="0" y="0" width="60" height="40" patternUnits="userSpaceOnUse">
      <g opacity="0.08" fill="#8b0000">
        <rect x="25" y="5" width="10" height="5" rx="1"/>
        <rect x="20" y="12" width="20" height="4" rx="1"/>
        <rect x="15" y="18" width="30" height="4" rx="1"/>
      </g>
    </pattern>

    <!-- Shoji Screen Pattern -->
    <pattern id="shoji-pattern" x="0" y="0" width="80" height="120" patternUnits="userSpaceOnUse">
      <rect width="80" height="120" fill="#faf7f2"/>
      <rect x="0" y="0" width="80" height="120" fill="url(#wood-grain)" opacity="0.03"/>
      <line x1="40" y1="0" x2="40" y2="120" stroke="#3d2817" stroke-width="3" opacity="0.4"/>
      <line x1="0" y1="0" x2="80" y2="0" stroke="#3d2817" stroke-width="3" opacity="0.4"/>
      <line x1="0" y1="60" x2="80" y2="60" stroke="#3d2817" stroke-width="3" opacity="0.4"/>
      <line x1="0" y1="120" x2="80" y2="120" stroke="#3d2817" stroke-width="3" opacity="0.4"/>
      <line x1="20" y1="0" x2="20" y2="60" stroke="#3d2817" stroke-width="1.5" opacity="0.3"/>
      <line x1="60" y1="0" x2="60" y2="60" stroke="#3d2817" stroke-width="1.5" opacity="0.3"/>
      <line x1="20" y1="60" x2="20" y2="120" stroke="#3d2817" stroke-width="1.5" opacity="0.3"/>
      <line x1="60" y1="60" x2="60" y2="120" stroke="#3d2817" stroke-width="1.5" opacity="0.3"/>
    </pattern>

    <!-- Wood Grain Texture -->
    <pattern id="wood-grain" x="0" y="0" width="200" height="100" patternUnits="userSpaceOnUse">
      <rect width="200" height="100" fill="#4a3425"/>
      <path d="M0,20 Q50,25 100,20 T200,20" fill="none" stroke="#3d2817" stroke-width="0.5" opacity="0.3"/>
      <path d="M0,40 Q50,42 100,40 T200,40" fill="none" stroke="#3d2817" stroke-width="0.5" opacity="0.2"/>
      <path d="M0,60 Q50,63 100,60 T200,60" fill="none" stroke="#3d2817" stroke-width="0.5" opacity="0.3"/>
      <path d="M0,80 Q50,78 100,80 T200,80" fill="none" stroke="#3d2817" stroke-width="0.5" opacity="0.2"/>
    </pattern>

    <!-- Paper Texture -->
  <!-- Premium washi paper texture filter -->
  <filter id="washi-paper">
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5" seed="1" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="1.5" result="light">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
    <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="0" k2="0.8" k3="0.2" k4="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.05"/>
    </feComponentTransfer>
  </filter>
  
  <!-- Premium wood grain texture filter -->
  <filter id="wood-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.05,0.8" numOctaves="6" seed="2" result="wood"/>
    <feColorMatrix in="wood" type="saturate" values="0.4" result="desaturated"/>
    <feDiffuseLighting in="desaturated" lighting-color="#8b4513" surfaceScale="3" result="lit">
      <feDistantLight azimuth="90" elevation="45"/>
    </feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.6"/>
    </feComponentTransfer>
  </filter>
  
  <!-- Paper texture filter (legacy) -->
  <filter id="paper-texture">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 0 0 1"/>
    </feComponentTransfer>
  </filter>
  
  <!-- Premium washi paper pattern -->
  <pattern id="washi-texture" width="200" height="200" patternUnits="userSpaceOnUse">
    <rect width="200" height="200" fill="#fffef9" filter="url(#washi-paper)"/>
  </pattern>
  
  <!-- Premium wood grain pattern (cedar) -->
  <pattern id="wood-texture-cedar" width="120" height="120" patternUnits="userSpaceOnUse">
    <rect width="120" height="120" fill="#8b4513"/>
    <path d="M0 20Q30 15 60 20T120 20M0 40Q30 35 60 40T120 40M0 60Q30 58 60 60T120 60M0 80Q30 75 60 80T120 80M0 100Q30 98 60 100T120 100" 
          stroke="#4a2f1a" stroke-width="2" fill="none" opacity="0.4"/>
    <rect width="120" height="120" fill="url(#wood-grain)" opacity="0.7"/>
  </pattern>
  
  <!-- Premium wood grain pattern (hinoki) -->
  <pattern id="wood-texture-hinoki" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="#d4a574"/>
    <path d="M0 15Q25 12 50 15T100 15M0 30Q25 28 50 30T100 30M0 45Q25 43 50 45T100 45M0 60Q25 58 50 60T100 60M0 75Q25 72 50 75T100 75M0 90Q25 88 50 90T100 90" 
          stroke="#8b6f47" stroke-width="1.5" fill="none" opacity="0.5"/>
    <rect width="100" height="100" fill="url(#wood-grain)" opacity="0.5"/>
  </pattern>
  
  <!-- Premium wood grain pattern (vermillion lacquer) -->
  <pattern id="wood-texture-lacquer" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="#c41e3a"/>
    <path d="M0 20Q25 18 50 20T100 20M0 40Q25 38 50 40T100 40M0 60Q25 59 50 60T100 60M0 80Q25 78 50 80T100 80" 
          stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.3"/>
    <rect width="100" height="100" fill="url(#wood-grain)" opacity="0.4"/>
  </pattern>
  
    <!-- Ink Brush Stroke -->
    <filter id="ink-brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
