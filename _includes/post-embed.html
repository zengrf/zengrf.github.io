  {% assign embed_src = page.embed_html | default: page.embed_url %}
  {% if embed_src %}
  <div class="post__embed">
    {% include panel-frame.html %}
    <button class="embed-fullscreen" type="button" aria-label="View interactive demo fullscreen" data-i18n-aria="ui.fullscreen">
      <svg class="embed-fullscreen__icon embed-fullscreen__icon--enter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h6v6"/>
        <path d="M9 21H3v-6"/>
        <path d="M21 3l-7 7"/>
        <path d="M3 21l7-7"/>
      </svg>
      <svg class="embed-fullscreen__icon embed-fullscreen__icon--exit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 14h6v6"/>
        <path d="M20 10h-6V4"/>
        <path d="M14 10l7-7"/>
        <path d="M10 14l-7 7"/>
      </svg>
    </button>
    <iframe src="{{ embed_src | relative_url | uri_escape | escape }}" title="{{ page.title | escape }}" loading="lazy" allowfullscreen></iframe>
  </div>
  {% endif %}
