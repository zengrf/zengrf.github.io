  hero.intro.1: |-
    你好！我是曾若凡，目前是西雅图华盛顿大学数学博士四年级的学生。我的导师是Jarod Alper和Sara Billey。我的研究方向是舒伯特演算、等变相交理论和模空间理论。我也热衷于数学形式化，以及用机器学习辅助数学发现。
  hero.intro.2: |-
    我于 2023 年毕业于宾夕法尼亚大学，本科的专业是数学和语言学，同时获得了应用数学与计算机科学硕士学位。我喜欢打网球，打篮球，和学语言。
  hero.intro.news1: |-
    自2026年6月起，我担任[华盛顿大学数学AI实验室](https://ai.math.uw.edu)的代理主管。我们组织了[2026年华盛顿大学Lean Hackathon](https://uw2026leanhackathon.github.io/)。自2026年夏起，我成为了[Simons Dissertation Fellow](https://www.simonsfoundation.org/grant/simons-dissertation-fellowship-in-mathematics/)。2026年秋季学期我将访问加州大学伯克利分校。
