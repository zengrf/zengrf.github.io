  hero.intro.1: |-
    こんにちは！曽・マイケルと申します。ワシントン大学シアトル校で数学の博士課程４年生として学んでおります。ジャロッド・アルパー先生とサラ・ビリー先生のもとで、シューベルト・カルキュラス、同変交叉理論、モジュライ理論を中心に研究しております。数学の形式化や、機械学習による数学研究の支援にも関心があります。
  hero.intro.2: |-
    2023年にペンシルベニア大学を卒業し、学士号は数学と言語学を専攻、修士号は応用数学とコンピュータサイエンスでした。趣味はテニス、バスケットボールと言語の勉強です。
  hero.intro.news1: |-
    2026年6月より、[ワシントン大学数学AIラボ](https://ai.math.uw.edu)の所長代理を務めています。[UW 2026 Lean ハッカソン](https://uw2026leanhackathon.github.io/)を主催しました。2026年夏からは[サイモンズ博士論文フェロー](https://www.simonsfoundation.org/grant/simons-dissertation-fellowship-in-mathematics/)です。2026年秋学期はカリフォルニア大学バークレー校に滞在します。
  hero.photo.caption: |-
    上海・豫園にて · 撮影：Alex Waugh
