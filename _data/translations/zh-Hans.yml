research.intro: |-
  我主要研究舒伯特演算、模叠上的相交理论和枚举几何，也对用机器学习和人工智能辅助数学研究感兴趣。
research.topics: |-
  最近常想的问题包括四次曲面上的直线、某些模叠的 $K_0$ 环、$\overline{\mathscr{M}}_{g,n}$ 上的 nef 除子、托里克簇上的线丛，以及稳定映射的模空间。
