  - （2024 春）*助教*，MATH 126 BA / BB：微积分与解析几何 III
  - （2024 冬）*助教*，MATH 125 CC / CD：微积分与解析几何 II
  - （2023 秋）*助教*，MATH 125 CE / CF：微积分与解析几何 II
teaching.wdrp.projects: |-
  - （2025 春）表示论漫游
  - （2024 春）枚举几何、关联几何、射影几何
  - （2024 冬）李群不是“谎言”：它们无处不在
ogura.intro: |-
  我很喜欢古典语言，曾与 [Paul Atkins](https://asian.washington.edu/people/paul-s-atkins) 教授合作研究日本古典和歌集《百人一首》。后续会在这里介绍更多。
posts.algebraic-k-theory.title: |-
  代数 K 理论 — SAAG（2023 年 12 月）
posts.algebraic-k-theory.intro: |-
  为 Student AAG 讨论班整理的代数 K 理论基础与计算概览。
posts.27-lines-bott-residue.title: |-
  用 Bott 留数公式数出 27 条直线 — 1-2-3 讨论班（2024 年 2 月）
posts.27-lines-bott-residue.intro: |-
  用 Atiyah–Bott 局部化公式计算光滑三次曲面上的 27 条直线，附有 Clebsch 三次曲面的 3D 模型。
posts.brackets-for-macaulay2.title: |-
  Macaulay2 的 Brackets 包
posts.brackets-for-macaulay2.intro: |-
  在 2023 年明尼苏达大学的 Macaulay2 工作坊期间，我参与开发了 [Brackets](https://github.com/Macaulay2/M2/tree/master/M2/Macaulay2/packages/Brackets.m2) 包，用于约化称为 bracket symbols 的经典 $SL_n$ 不变量。
posts.intersection-theory-27-lines.title: |-
  相交理论：27 条直线的变奏
posts.intersection-theory-27-lines.intro: |-
  MATH 583C 课程笔记，整理了计算三次曲面上 27 条直线的几种方法。
posts.equivariant-k-theory.title: |-
  等变 K 理论 — DubTop（2024 年 5 月）
posts.equivariant-k-theory.intro: |-
  DubTop 讨论班报告，从几个角度简要介绍等变 K 理论，并给出例子和计算。
posts.intersection-theory-3264.title: |-
  相交理论：3264 and All That
posts.intersection-theory-3264.intro: |-
  MATH 583C 课程笔记，介绍如何计算射影平面 $\mathbb P^2$ 中与给定的 5 条二次曲线相切的 3264 条二次曲线。
posts.neural-networks-with-math.title: |-
  Neural Networks with Math：神经网络背后的数学
posts.neural-networks-with-math.intro: |-
  我为 [Linhang Huang](https://linhang-h.github.io/) 的博客 [Neural Networks with Math](https://linhang-h.github.io/Neural-Networks-with-Math/) 写过文章，介绍深度学习架构背后的数学。这篇是关于 G-CNN 的笔记：[群等变神经网络](https://linhang-h.github.io/Neural-Networks-with-Math/posts/post4/)。
posts.gromov-witten-invariants.title: |-
  Gromov–Witten 不变量
posts.gromov-witten-invariants.intro: |-
  这是我在 [Thomas Brazelton](https://tbrazel.github.io/) 组织的 [eCHT 二次型值曲线计数讨论班](https://tbrazel.github.io/teaching/24c_curves.html)上介绍 Gromov–Witten 不变量与量子上同调时使用的笔记。
posts.invariantring2-tutorial.title: |-
  Macaulay2 InvariantRing2 教程
posts.invariantring2-tutorial.intro: |-
  这份用 PreTeXt 编写的教程，通过 `InvariantRing2` 包中的例子介绍 Macaulay2 语言。它源于 [Jarod Alper](https://sites.math.washington.edu//~jarod/) 教授的 [MATH 509：高等交换代数与概形理论](https://sites.math.washington.edu//~jarod/math509-spring25.html)课程项目。我是从 [Francesca Gandini](https://sites.google.com/a/umich.edu/gandini/about-me?authuser=0) 那里了解到 [PreTeXt](https://pretextbook.org/) 的。
posts.brieskorn-rational-singularities.title: |-
  Brieskorn（1968）：有理奇点
posts.brieskorn-rational-singularities.intro: |-
  Egbert Brieskorn 1968 年关于曲面有理奇点的论文的英文译稿。
posts.latex-commands.title: |-
  常用 TeX 数学符号
posts.latex-commands.intro: |-
  一份在网上找到的 LaTeX 数学命令速查表。
posts.intersection-homology.title: |-
  交叉同调
posts.intersection-homology.intro: |-
  2024 年 11 月在 [eCHT Kan 讨论班](https://s.wayne.edu/echt/echt-reading-seminars/kan-seminar-fall-2024/)上介绍交叉同调和反常层时使用的笔记。
posts.freudenthal-magic-square.title: |-
  Freudenthal 魔方阵
posts.freudenthal-magic-square.intro: |-
  Julia Pevtsova 教授的 MATH 507：代数结构课上的报告，主题是例外李代数与 Freudenthal 魔方阵。我与 Zachary Wallace-Wells、Zawad Chowdhury 和 Bryan Lu 一起完成了这次报告。
posts.degeneracy-loci-talk.title: |-
  退化轨迹与双舒伯特多项式
posts.degeneracy-loci-talk.intro: |-
  关于退化轨迹公式和双舒伯特多项式的讨论班笔记，参考 Billey–Gao–Pawlowski（2025）的 [*Introduction to the Cohomology of the Flag Variety*](https://arxiv.org/abs/2506.21064) 第 5.4 节。
posts.lightning-talk-combo-seminar.title: |-
  UW 组合与几何讨论班短报告
posts.lightning-talk-combo-seminar.intro: |-
  我在 [UW 组合与几何讨论班](https://sites.math.washington.edu/~combinat/#past-talks)上作短报告时使用的幻灯片。
posts.plucker-formula.title: |-
