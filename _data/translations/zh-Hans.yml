teaching.milestone.text: |-
  2025 年春季，我与 [Zawad Chowdhury](https://sites.math.washington.edu/~zawadx/) 一起协助组织了 [Writing Milestone 讨论班](https://sites.math.washington.edu/~zawadx/milestone_sem.html)。讨论班面向正在完成 [writing milestone](https://math.washington.edu/writing-milestone) 的低年级研究生，让大家有机会介绍自己近期深入学习的数学课题，也交流初次撰写数学文章的经历。
teaching.curves.text: |-
  2025 年冬季，我组织了一个代数曲线研究生阅读班，由 [Giovanni Inchiostro](https://math.washington.edu/people/giovanni-inchiostro) 指导。详情见[代数曲线讨论班网页](https://sites.google.com/uw.edu/algebraic-curves-seminar/home)。
teaching.intersection.text: |-
  2024 年春季，我与 [Arkamouli Debnath](https://sites.google.com/view/arkamouli/courses-and-research?authuser=0) 一起组织了相交理论研究生阅读班，由 [Sándor Kovács](https://math.washington.edu/people/sandor-kovacs) 指导。笔记和日程见[课程网页](https://sites.google.com/view/uwmath583cintersectiontheory)。
teaching.linear.text: |-
  2025 年夏季，我独立讲授了 [MATH 208 C：线性代数](https://sites.math.washington.edu/~m208/)。课程采用线上线下混合教学，并提供 Zoom 录像，共有 83 名学生。
teaching.duties.intro: |-
  以下是我担任助教和作业批改员的课程。
teaching.mentorship.intro: |-
  我在华盛顿大学数学 AI 实验室、华盛顿实验数学实验室（WXML）和华盛顿指导阅读计划（WDRP）中参与学生指导。
teaching.ai.circuits: |-
  我参与指导[多项式的强化学习](https://github.com/uw-math-ai/PolyArithmeticCircuitsRL/tree/rohan-new-branch)项目，与 [Jarod Alper](https://sites.math.washington.edu//~jarod/) 及团队成员一起，尝试训练类似 AlphaZero 的强化学习智能体，以更少的运算计算多项式。这可以看作自动生成证明的一个极简模型。项目成果已形成 ICLR 研讨会论文 [CircuitBuilder: From Polynomials to Circuits via Reinforcement Learning](https://arxiv.org/abs/2603.17075)。
teaching.ai.cayley: |-
  我也参与指导 [CayleyPy: Advancing Group Theory with AI](https://github.com/uw-math-ai/cayley-py) 项目，用 AI 探索群论问题。
teaching.ai.networks: |-
  在数学 AI 实验室 2024—2025 年度的项目中，我指导了“神经网络能够学会哪些数学函数？”这一课题。
teaching.wxml.current: |-
  2026 年春季，我参与指导“微积分可视化：利用 Desmos、3D 打印等工具进行交互式建模”项目。
teaching.wxml.prints: |-
  2025 年春季，我参与指导“用 3D 打印和动画辅助微积分教学”项目。我与 [Andy Loveless](https://sites.math.washington.edu/~aloveles/) 及团队成员一起制作数学对象的 3D 打印模型，用于微积分教学，也帮助学生培养几何直觉。已经完成的模型收录在这个不断更新的[几何模型图集](https://sites.math.washington.edu/~aloveles/CalcVisuals/)中。下面这几件是我特别喜欢的：
teaching.wdrp.intro: |-
  我指导过以下 WDRP 阅读项目。
teaching.wdrp.talk: |-
  我在 2025 年春季 WDRP 讨论班上作过一次报告。这个讨论班由研究生面向初学者介绍与自己研究相关的数学。[报告幻灯片见此处](/notes/2025/04/23/WDRP-talk/)。
teaching.duties.2025: |-
  - （2025 秋）*助教*，MATH 208：线性代数
teaching.duties.2024: |-
