hero.intro.1: |-
  你好，我是曾若凡，在西雅图华盛顿大学攻读数学博士，目前是四年级。我的导师是 Jarod Alper 和 Sara Billey。我主要研究舒伯特演算、等变相交理论和模空间，也对数学形式化，以及用机器学习辅助数学研究感兴趣。
hero.intro.2: |-
  我于 2023 年毕业于宾夕法尼亚大学，本科双修数学和语言学，同时获得了应用数学与计算机科学硕士学位。数学之外，我喜欢打网球、篮球，也喜欢学外语。
hero.intro.news1: |-
  2026 年 6 月起，我担任[华盛顿大学数学 AI 实验室](https://ai.math.uw.edu)代理主任。我们举办了 [UW 2026 Lean Hackathon](https://uw2026leanhackathon.github.io/)。2026 年夏季起，我获得了 [Simons Dissertation Fellowship](https://www.simonsfoundation.org/grant/simons-dissertation-fellowship-in-mathematics/)，并将在秋季学期访问加州大学伯克利分校。
