research.intro: |-
  シューベルト・カルキュラス、モジュライスタック上の交叉理論、数え上げ幾何を研究しています。機械学習やAIを数学研究にどう役立てられるかにも関心があります。
research.topics: |-
  最近は、4次曲面上の直線、いくつかのモジュライスタックの $K_0$ 環、$\overline{\mathscr{M}}_{g,n}$ 上のネフ因子、トーリック多様体の直線束、安定写像のモジュライ空間などについて考えています。
research.publications: |-
  論文・プレプリント
