hero.intro.1: |-
  ワシントン大学シアトル校で数学の博士課程に在籍している曽若凡（Michael Zeng）です。現在4年目で、Jarod Alper 先生と Sara Billey 先生の指導のもと、シューベルト・カルキュラス、同変交叉理論、モジュライ理論を研究しています。数学の形式化や、機械学習を使った数学研究にも関心があります。
hero.intro.2: |-
  2023年にペンシルベニア大学を卒業しました。学部では数学と言語学を専攻し、応用数学・計算機科学の修士号も取得しました。研究の合間にはテニスやバスケットボールをしたり、外国語を勉強したりしています。
hero.intro.news1: |-
  2026年6月から[ワシントン大学数学AIラボ](https://ai.math.uw.edu)の所長代理を務めています。[UW 2026 Lean Hackathon](https://uw2026leanhackathon.github.io/)を開催しました。同年夏からは [Simons Dissertation Fellowship](https://www.simonsfoundation.org/grant/simons-dissertation-fellowship-in-mathematics/) の支援を受け、秋学期はカリフォルニア大学バークレー校に滞在する予定です。
