---
layout: default
---
<article class="post">
  <header class="post__header">
    {% include back-link.html %}
    <h1>{{ page.title }}</h1>
    <p class="post__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %e, %Y" }}</time>
      {% if page.tags %}
      · {{ page.tags | array_to_sentence_string }}
      {% endif %}
    </p>
  </header>
  <div class="post__content">
    {{ content }}
  </div>
  {% if page.embed_html %}
  <div class="post__embed">
    <button class="embed-fullscreen" type="button" aria-label="View interactive demo fullscreen">
      <svg class="embed-fullscreen__icon embed-fullscreen__icon--enter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h6v6"/>
        <path d="M9 21H3v-6"/>
        <path d="M21 3l-7 7"/>
        <path d="M3 21l7-7"/>
      </svg>
      <svg class="embed-fullscreen__icon embed-fullscreen__icon--exit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 14h6v6"/>
        <path d="M20 10h-6V4"/>
        <path d="M14 10l7-7"/>
        <path d="M10 14l-7 7"/>
      </svg>
    </button>
    <iframe src="{{ page.embed_html | relative_url | replace: ' ', '%20' }}" title="{{ page.title }}" loading="lazy" allowfullscreen></iframe>
  </div>
  {% endif %}
  
  <section class="post__comments" aria-label="Comments">
    <h2 class="post__comments-title">Comments</h2>
    <div id="utterances-thread"></div>
    <script src="https://utteranc.es/client.js"
            repo="zengrf/zengrf.github.io"
            issue-term="pathname"
            theme="github-light"
            crossorigin="anonymous"
            async>
    </script>
  </section>
</article>
