<!DOCTYPE html>
<html lang="en" data-baseurl="{{ site.baseurl | default: '' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4c3520" />
    <script>
      (function () {
        var KEY = 'site.time-theme', m;
        try { m = localStorage.getItem(KEY); } catch (e) {}
        if (['day','dusk','night'].indexOf(m) < 0) {
          var h = new Date().getHours() + new Date().getMinutes() / 60;
          m = (h >= 7 && h < 16) ? 'day' : ((h >= 16 && h < 19.5) || (h >= 5 && h < 7)) ? 'dusk' : 'night';
        }
        document.documentElement.setAttribute('data-time', m);
      })();
    </script>
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:wght@600;700&family=Zen+Old+Mincho:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
    {% seo %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body class="site-body">
    <header class="site-header">
      <div class="eave" aria-hidden="true"></div>
      <div class="container">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand__title">{{ site.title }}</span>
          <span class="brand__subtitle" data-i18n="brand.subtitle">Graduate student in mathematics</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
          <ul id="nav-links">
            {% for item in site.data.navigation.main %}
            {% assign item_url_index = item.url | append: 'index.html' %}
            <li class="{% if page.url == item.url or page.url == item_url_index %}active{% endif %}">
              <a href="{{ item.url | relative_url }}" data-i18n="nav.{{ item.key }}">{{ item.title }}</a>
            </li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </header>

    <main class="site-main" id="main">
      <div class="container frame">
        <div class="ranma-wrap" aria-hidden="true"><div class="ranma"></div></div>
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <button class="time-toggle" type="button" aria-label="Theme: auto. Click to change.">
          <span class="time-icon" aria-hidden="true"></span>
        </button>
        <div class="lang-overlay" id="lang-overlay" aria-hidden="true">
          <button class="lang-toggle" aria-controls="lang-overlay" aria-expanded="false" aria-label="Change language">
            <span class="lang-current">English</span>
          </button>
          <ul class="lang-list">
            <li><button type="button" data-lang="en" class="lang-option">English</button></li>
            <li><button type="button" data-lang="zh-Hans" class="lang-option">简体中文</button></li>
            <li><button type="button" data-lang="ja" class="lang-option">日本語</button></li>
          </ul>
        </div>
        <p data-i18n="footer.copyright">&copy; {{ site.title | escape }} · {{ "now" | date: "%Y" }} · Seattle, WA</p>
      </div>
    </footer>

    <script>
      const toggle = document.querySelector('.nav-toggle');
      const navList = document.getElementById('nav-links');
      if (toggle && navList) {
        toggle.addEventListener('click', () => {
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          navList.classList.toggle('open');
        });
      }
    </script>
    <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <script src="{{ '/assets/js/lang.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <script src="{{ '/assets/js/enhancements.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
