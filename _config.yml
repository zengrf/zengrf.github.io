
title: "Michael R. Zeng 曽若凡"
description: "Graduate student in mathematics, University of Washington"
url: "https://zengrf.github.io"
baseurl: ""
repository: "zengrf/zengrf.github.io"

markdown: kramdown
theme: null
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "wabi"

paginate: 10
timezone: "America/Los_Angeles"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-paginate
  - jekyll-include-cache

kramdown:
  input: GFM
  math_engine: mathjax
  hard_wrap: false

include:
  - "pages"
  - "assets/i18n"

collections:
  posts:
    output: true
    permalink: /notes/:year/:month/:day/:title/

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      tags: [notes]

author:
  name: "Michael R. Zeng"
  avatar: "/assets/img/avatar.png"
  bio: "Math PhD student. Algebraic geometry, homotopy theory, combinatorics; interactive computation & visualization."
  location: "Seattle, WA"
  links:
    - label: "Email"
      url: "mailto:zengrf@uw.edu"
      icon: "fas fa-envelope"
    - label: "GitHub"
      url: "https://github.com/zengrf"
      icon: "fab fa-github"
    - label: "UW Math"
      url: "https://math.washington.edu/people/michael-zeng"
      icon: "fas fa-university"

twitter:
  username: ""
logo: "/assets/img/avatar.png"
