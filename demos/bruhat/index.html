
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S₄ Bruhat Graph</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
body{font-family:"EB Garamond","Times New Roman",Times,serif;margin:0;padding:1rem;background:var(--bg);color:var(--ink)}
h1{font-family:"Cormorant Garamond",serif;margin:0 0 .5rem;color:var(--primary)}
#cy{width:100%;height:80vh;border:1px solid rgba(0,0,0,.08);border-radius:12px;background:color-mix(in oklab, var(--bg) 96%, white)}
.controls{margin-bottom:.8rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
button{font-family:inherit;border:1px solid var(--accent);background:linear-gradient(180deg, color-mix(in oklab, var(--bg) 98%, white), color-mix(in oklab, var(--bg) 90%, white));padding:.4rem .7rem;border-radius:999px;color:var(--primary);cursor:pointer}
label{user-select:none}
</style></head><body>
<h1>S₄ Bruhat Graph</h1>
<div class="controls"><span id="stats">Loading…</span><button id="layout">Re-layout</button>
<label><input type="checkbox" id="showLabels" checked> Show labels</label></div>
<div id="cy"></div>
<script>
function permutations(a){if(a.length===1)return[a];const r=[];for(let i=0;i<a.length;i++){const c=a[i],rest=a.slice(0,i).concat(a.slice(i+1));for(const p of permutations(rest))r.push([c].concat(p));}return r;}
function inversions(p){let inv=0;for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++)if(p[i]>p[j])inv++;return inv;}
function swapAdjacent(p,i){const a=p.slice();[a[i],a[i+1]]=[a[i+1],a[i]];return a;}
const id=p=>p.join("");
const S4=permutations([1,2,3,4]); const lengths={}, layers={};
for(const p of S4){const i=id(p),l=inversions(p);lengths[i]=l;(layers[l]??=[]).push(p);}
const nodes=S4.map(p=>({data:{id:id(p),label:id(p),len:lengths[id(p)]}}));
const edges=[]; for(const w of S4){const wl=inversions(w);for(let i=0;i<3;i++){const ws=swapAdjacent(w,i),wsl=inversions(ws);if(wsl===wl+1)edges.push({data:{id:id(w)+"_s"+(i+1)+"_"+id(ws),source:id(w),target:id(ws)}});}}
const pos={}, yGap=120,xGap=80;
Object.keys(layers).sort((a,b)=>a-b).forEach((l,row)=>{const arr=layers[l],width=(arr.length-1)*xGap;arr.forEach((p,i)=>pos[id(p)]={x:-width/2+i*xGap,y:row*yGap});});
const cy=cytoscape({
  container:document.getElementById('cy'),
  elements:{nodes,edges},
  style:[
    {selector:'node',style:{'background-color':'var(--primary)','label':'data(label)','color':'var(--bg)','text-valign':'center','text-halign':'center','font-size':12,'width':36,'height':36}},
    {selector:'edge',style:{'width':2,'line-color':'var(--accent)','target-arrow-color':'var(--accent)','curve-style':'bezier','target-arrow-shape':'triangle','arrow-scale':1}}
  ],
  layout:{name:'preset',positions:ele=>pos[ele.id()],fit:true,padding:40},
  wheelSensitivity:.25
});
document.getElementById('stats').textContent=`Nodes: ${nodes.length}, Edges: ${edges.length}`;
document.getElementById('layout').addEventListener('click',()=>cy.layout({name:'preset',positions:ele=>pos[ele.id()],fit:true,padding:40}).run());
document.getElementById('showLabels').addEventListener('change',e=>cy.style().selector('node').style('label',e.target.checked?'data(label)':'').update());
</script>
</body></html>
