<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pyodide Playground</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 1rem; }
    h1 { font-family: 'Cormorant Garamond', serif; margin: 0 0 0.5rem; }
    textarea { width: 100%; height: 260px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; border-radius: 8px; padding: 0.6rem; }
    pre { background: #111; color: #e6e6e6; padding: 0.8rem; border-radius: 8px; min-height: 160px; overflow: auto; }
    button { padding: 0.5rem 0.9rem; border-radius: 8px; border: 1px solid #ccc; background: #f7f7f7; cursor: pointer; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .col { flex: 1 1 420px; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
  <h1>Pyodide Playground</h1>
  <p>Run small Python snippets in your browser—no server needed.</p>

  <div class="row">
    <div class="col">
      <textarea id="code">import sys
print("Hello from Python", sys.version)
# Try some math
import math
print("π ≈", math.pi)</textarea>
      <div style="margin-top: 0.5rem;">
        <button id="runBtn">Run (Shift+Enter)</button>
        <button id="clearBtn">Clear Output</button>
      </div>
    </div>
    <div class="col">
      <pre id="output"></pre>
    </div>
  </div>

  <script>
    const out = document.getElementById('output');
    const code = document.getElementById('code');

    function printToOut(s){
      out.textContent += s + "\n";
    }

    async function ensurePyodide(){
      if (!window.pyodideReadyPromise) {
        window.pyodideReadyPromise = loadPyodide();
      }
      return await window.pyodideReadyPromise;
    }

    async function run(){
      const pyodide = await ensurePyodide();
      out.textContent = "";
      try {
        const result = await pyodide.runPythonAsync(code.value);
        if (result !== undefined) printToOut(String(result));
      } catch (err) {
        printToOut(String(err));
      }
    }

    document.getElementById('runBtn').addEventListener('click', run);
    document.getElementById('clearBtn').addEventListener('click', ()=> out.textContent="");
    code.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter' && e.shiftKey) {
        e.preventDefault();
        run();
      }
    });
  </script>
</body>
</html>
