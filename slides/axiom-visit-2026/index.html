lication/x-tex\"\u003e[x,y]\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"\u003e\u003c/span\u003e\u003cspan class=\"mopen\"\u003e[\u003c/span\u003e\u003cspan class=\"mord mathnormal\"\u003ex\u003c/span\u003e\u003cspan class=\"mpunct\"\u003e,\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.03588em;\"\u003ey\u003c/span\u003e\u003cspan class=\"mclose\"\u003e]\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e.\u003c/p\u003e\n\u003csection class=\"paper-statement\"\u003e\u003cdiv class=\"statement-label\"\u003eTheorem (Davies et al. 2021)\u003c/div\u003e\u003cdiv class=\"statement-text\"\u003e\u003cp\u003eEvery Bruhat interval admits a canonical hypercube decomposition along its extremal reflections, from which the KL polynomial is directly computable.\u003c/p\u003e\n\u003c/div\u003e\u003c/section\u003e\u003csection class=\"paper-statement\"\u003e\u003cdiv class=\"statement-label\"\u003eProposed extension\u003c/div\u003e\u003cdiv class=\"statement-text\"\u003e\u003cp\u003eThe same computation for \u003cstrong\u003eany\u003c/strong\u003e hypercube decomposition would prove combinatorial invariance for symmetric groups. \u003ca href=\"https://doi.org/10.1090/ert/624\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBlundell et al. (2022)\u003c/a\u003e.\u003c/p\u003e\n\u003c/div\u003e\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e27\u003c/span\u003e\u003c/footer\u003e"}, {"id": "small-model-precedents", "title": "Interpreting small models", "nav": "Interpreting small models", "layout": "standard", "class": "slide layout-standard axiom-slide property-highlights ax-grouped ax-grouped-three ax-grouped-models ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eConjectures and learned algorithms\u003c/p\u003e\u003ch1\u003eInterpreting small models\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://arxiv.org/abs/2605.30482\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHuang et al. (2026)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/huang-path.png\" alt=\"Huang et al. Figure 3a, Dyck paths with attended positions\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFigure 3(a).\u003c/strong\u003e Attention and ablations led to a traversal algorithm proved equivalent to the zeta map.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://proceedings.mlr.press/v267/he25g.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHe et al. (2025)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/he-fig5-first.png\" alt=\"He et al. Figure 5 first example, type D quiver edge attribution\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFigure 5, first example.\u003c/strong\u003e Edge attribution identifies subgraphs used to recognize quiver mutation classes.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://arxiv.org/abs/2301.05217\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNanda et al. (2023)\u003c/a\u003e\u003c/h3\u003e\n\u003ch3\u003e\u003ca href=\"https://proceedings.mlr.press/v202/chughtai23a.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChughtai et al. (2023)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/chughtai-fig1.png\" alt=\"Chughtai et al. Figure 1, representation-matrix computation\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChughtai et al., Figure 1.\u003c/strong\u003e Representation matrices explain group composition; Fourier features explain modular addition.\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e28\u003c/span\u003e\u003c/footer\u003e"}, {"id": "llm-conjecturing-meca", "title": "LLM conjecture generation", "nav": "LLM conjecture generation", "layout": "standard", "class": "slide layout-standard axiom-slide property-highlights ax-grouped ax-grouped-two ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eMechanisms and theorem libraries\u003c/p\u003e\u003ch1\u003eLLM conjecture generation\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://arxiv.org/abs/2607.27709\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLong et al. (2026)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/meca-fig1-detail.png\" alt=\"MECA Figure 1 co-exploration detail\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMECA · Figure 1, detail.\u003c/strong\u003e Revise conjectures and supporting mathematical mechanisms using separate critics.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://arxiv.org/abs/2509.14274\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eKasaura et al. (2025)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/kasaura-1-1.png\" alt=\"Figure 1, library–conjecturer–prover loop\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFigure 1.\u003c/strong\u003e Verified conjectures and proofs return to a library that supplies the next prompts.\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e29\u003c/span\u003e\u003c/footer\u003e"}, {"id": "llm-conjecturing-formal", "title": "LLM conjecture generation", "nav": "LLM conjecture generation", "layout": "standard", "class": "slide layout-standard axiom-slide property-highlights ax-grouped ax-grouped-two ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eVerification and self-play\u003c/p\u003e\u003ch1\u003eLLM conjecture generation\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://arxiv.org/abs/2506.22005\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eOnda et al. (2025)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/onda-fig3-detail.png\" alt=\"LeanConjecturer Figure 3 detail, exact? duplicate check\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLeanConjecturer · Figure 3, detail.\u003c/strong\u003e Lean's \u003ccode\u003eexact?\u003c/code\u003e filters a statement already available in the context.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://proceedings.mlr.press/v267/dong25h.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eDong–Ma (2025)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/stp-1-1.png\" alt=\"STP Figure 1, self-play conjecturing and proving\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSTP · Figure 1.\u003c/strong\u003e Verified proofs train the prover; difficult but provable conjectures train the conjecturer.\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e30\u003c/span\u003e\u003c/footer\u003e"}, {"id": "discovery-program-search", "title": "Searching for constructions", "nav": "Searching for constructions", "layout": "standard", "class": "slide layout-standard axiom-slide property-highlights ax-grouped ax-grouped-three ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003ePrograms, evaluation, and training\u003c/p\u003e\u003ch1\u003eSearching for constructions\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://www.nature.com/articles/s41586-023-06924-6\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRomera-Paredes et al. (2024)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/funsearch-1-1.png\" alt=\"FunSearch Figure 1, generation and evaluation\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFunSearch · Figure 1.\u003c/strong\u003e Evaluated programs return in later prompts.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://arxiv.org/abs/2506.13131\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNovikov et al. (2025)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/alphaevolve-fig2.png\" alt=\"AlphaEvolve Figure 2, discovery process\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAlphaEvolve · Figure 2.\u003c/strong\u003e Evolve programs against a scientist-supplied evaluator.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003e\u003ca href=\"https://arxiv.org/abs/2411.00566\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCharton et al. (2024)\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/patternboost-last.png\" alt=\"PatternBoost Figure 4 final panel, edge-count distribution\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePatternBoost · Figure 4, final panel.\u003c/strong\u003e Alternate local search and transformer training; scores are edge counts of triangle-free graphs on 20 vertices.\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e31\u003c/span\u003e\u003c/footer\u003e"}, {"id": "patternminer-comparison", "title": "PatternMiner (2026)", "nav": "PatternMiner (2026)", "layout": "standard", "class": "slide layout-standard axiom-slide ax-table ax-lit-comparison ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eLLM-guided experiments · Small-model interpretation\u003c/p\u003e\u003ch1\u003e\u003ca href=\"https://openreview.net/forum?id=DMYzqGQMGS\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePatternMiner (2026)\u003c/a\u003e\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth align=\"left\"\u003eApproach\u003c/th\u003e\n\u003cth align=\"left\"\u003eSource of conjectures\u003c/th\u003e\n\u003cth align=\"left\"\u003eFeedback changes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e n\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003es\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.3361em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mathnormal mtight\" style=\"margin-right:0.02778em;\"\u003eθ\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e, and a missing second part is zero.\u003c/p\u003e\n\u003c/div\u003e\u003c/section\u003e\n\u003cp\u003eThe proof gives a nonnegative Stanley–Stembridge character decomposition.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e49\u003c/span\u003e\u003c/footer\u003e"}, {"id": "other-investigations", "title": "PatternMiner", "nav": "PatternMiner", "layout": "standard", "class": "slide layout-standard axiom-slide ax-pm property-highlights ax-two ax-pm-outcomes ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003ePatternMiner · Two further investigations\u003c/p\u003e\u003ch1\u003ePatternMiner\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eCharacter-table row sums\u003c/h3\u003e\n\u003cp\u003eThe LLM trained a linear model to pair negative tableaux with positive tableaux. Held-out collisions refuted injectivity.\u003c/p\u003e\n\u003cp\u003eFor a fixed tail \u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003eν\u003c/mi\u003e\u003cmo\u003e⊢\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\nu\\vdash k\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.6944em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.06366em;\"\u003eν\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e⊢\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.6944em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.03148em;\"\u003ek\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e, the LLM derived an exact evaluation formula for the row indexed by \u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmi\u003ek\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eν\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e(n-k,\\nu)\u003c/a ircuit optimization", "nav": "Quantum circuit optimization", "layout": "standard", "class": "slide layout-standard axiom-slide ax-paper ax-circuit-results ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eCircuitPilot · Development results\u003c/p\u003e\u003ch1\u003eQuantum circuit optimization\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cp\u003e\u003cstrong\u003e70 wins · 82 ties · 9 losses\u003c/strong\u003e on 161 three-qubit circuits.\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"assets/papers/circuitpilot-fig5.png\" alt=\"CircuitPilot Figure 5: quantum win, tie, and loss counts by circuit family\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFigure 5.\u003c/strong\u003e Compared with step-8 Quasar; time limits are 30 minutes for CircuitPilot and 1 minute for Quasar. Wins mostly reduce gate count or depth at fixed CX count.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e58\u003c/span\u003e\u003c/footer\u003e"}, {"id": "quantum-rewrite-rules", "title": "Quantum circuit optimization", "nav": "Quantum circuit optimization", "layout": "standard", "class": "slide layout-standard axiom-slide ax-table ax-circuit-rules ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eSame policy weights · Different rewrite rules\u003c/p\u003e\u003ch1\u003eQuantum circuit optimization\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth align=\"left\"\u003eRewrite rules\u003c/th\u003e\n\u003cth align=\"right\"\u003eWins\u003c/th\u003e\n\u003cth align=\"right\"\u003eTies\u003c/th\u003e\n\u003cth align=\"right\"\u003eLosses\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd align=\"left\"\u003eInitial rules\u003c/td\u003e\n\u003ctd align=\"right\"\u003e46\u003c/td\u003e\n\u003ctd align=\"right\"\u003e81\u003c/td\u003e\n\u003ctd align=\"right\"\u003e34\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd align=\"left\"\u003eRemove an expansion rule\u003c/td\u003e\n\u003ctd align=\"right\"\u003e57\u003c/td\u003e\n\u003ctd align=\"right\"\u003e91\u003c/td\u003e\n\u003ctd align=\"right\"\u003e13\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd align=\"left\"\u003eAdd simplification rules\u003c/td\u003e\n\u003ctd align=\"right\"\u003e\u003cstrong\u003e70\u003c/strong\u003e\u003c/td\u003e\n\u003ctd align=\"right\"\u003e\u003cstrong\u003e82\u003c/strong\u003e\u003c/td\u003e\n\u003ctd align=\"right\"\u003e\u003cstrong\u003e9\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eEven a valid rewrite can hurt when search has a budget.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTable 2.\u003c/strong\u003e Same 161 development circuits and step-8 Quasar reference.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e59\u003c/span\u003e\u003c/footer\u003e"}, {"id": "polynomial-boolean-results", "title": "Polynomial and Boolean experiments", "nav": "Polynomial and Boolean experiments", "layout": "standard", "class": "slide layout-standard axiom-slide property-highlights ax-two ax-circuit-other ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eCircuitPilot · Current results\u003c/p\u003e\u003ch1\u003ePolynomial and Boolean experiments\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cdiv class=\"property-grid\"\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003ePolynomial optimization\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e400 development circuits\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAn imitation-only policy uses \u003cstrong\u003e0.25% fewer operations\u003c/strong\u003e than the best fixed procedure sequence.\u003c/p\u003e\n\u003cp\u003eRunning all three fixed sequences and keeping the best result for each input still does better.\u003c/p\u003e\n\u003c/section\u003e\u003csection class=\"property-card\"\u003e\u003ch3\u003eBoolean input coverage\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e98 of 100 benchmarks\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe environment loads and encodes the IWLS 2026 circuits as model inputs.\u003c/p\u003e\n\u003cp\u003eThis study evaluates encoding; Boolean optimization performance remains to be measured.\u003c/p\u003e\n\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"slide-footer\"\u003e\u003cspan class=\"slide-number\"\u003e60\u003c/span\u003e\u003c/footer\u003e"}, {"id": "circuitpilot-demo", "title": "CircuitPilot", "nav": "CircuitPilot", "layout": "standard", "class": "slide layout-standard axiom-slide ax-demo ", "style": "", "html": "\u003cdiv class=\"top-rail\"\u003e\u003c/div\u003e\u003cdiv class=\"transom\"\u003e\u003c/div\u003e\u003cdiv class=\"bottom-rail\"\u003e\u003c/div\u003e\u003cp class=\"eyebrow\"\u003eDemonstration\u003c/p\u003e\u003ch1\u003eCircuitPilot\u003c/h1\u003e\u003cdiv class=\"slide-grid\"\u003e\u003cdiv class=\"slide-body\"\u003e\u003cdiv class=\"slide-content\"\u003e\u003cblockquote\u003e\n\u003cp\u003eStart with a circuit. Follow the optimization choices. Compare the resulting circuit and its cost.\u003c/p\u003e\n\u00
